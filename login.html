<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if register %}
            Register
        {% else %}
            Login
        {% endif %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            {% if register %}

                <h1>Create Account</h1>

                <form method="POST">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                    <button type="submit">
                        Register
                    </button>

                </form>

                <p>
                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>
                </p>

            {% else %}

                <h1>Employee Login</h1>

                {% if error %}

                    <p class="error">
                        {{ error }}
                    </p>

                {% endif %}

                <form method="POST">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>

                <p>
                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>
                </p>

            {% endif %}

        </div>

    </div>

</body>

</html>
